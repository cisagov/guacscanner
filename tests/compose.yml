---
# This Docker composition file is used to stand up an Apache Guacamole server
# with a PostgreSQL database backend and the guacscanner utility for
# auto-discovering and adding connections.

name: guacscanner-test

secrets:
  postgres_password:
    file: ./secrets/postgres-password
  postgres_username:
    file: ./secrets/postgres-username

volumes:
  dbdata:
  initdb:

services:
  postgres:
    container_name: postgres
    environment:
      POSTGRES_DB: guacamole_db
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres-password
      POSTGRES_USER_FILE: /run/secrets/postgres-username
    healthcheck:
      interval: 10s
      retries: 5
      start_period: 30s
      test:
        - CMD-SHELL
        - pg_isready --dbname=$$POSTGRES_DB
      timeout: 5s
    image: postgres:18
    ports:
      - 127.0.0.1:5432:5432/tcp
    secrets:
      - source: postgres_password
        target: postgres-password
      - source: postgres_username
        target: postgres-username
    volumes:
      - read_only: true
        source: initdb
        target: /docker-entrypoint-initdb.d
        type: volume
      - source: dbdata
        target: /var/lib/postgresql
        type: volume

  guacamole:
    command:
      - /bin/sh
      - -c
      - |
        export POSTGRESQL_USERNAME=$$(cat /run/secrets/postgres-username);
        export POSTGRESQL_PASSWORD=$$(cat /run/secrets/postgres-password);
        /opt/guacamole/bin/entrypoint.sh
    container_name: guacamole
    depends_on:
      - postgres
    environment:
      GUACD_HOSTNAME: guacd
      GUACD_PORT: 4822
      HTTP_AUTH_ENABLED: "true"
      POSTGRESQL_DATABASE: guacamole_db
      POSTGRESQL_ENABLED: "true"
      POSTGRESQL_HOSTNAME: postgres
      POSTGRESQL_PORT: 5432
    image: guacamole/guacamole:1.6.0
    ports:
      - 127.0.0.1:8080:8080/tcp
    secrets:
      - source: postgres_password
        target: postgres-password
      - source: postgres_username
        target: postgres-username
    volumes:
      - read_only: true
        source: initdb
        target: /opt/guacamole/extensions/guacamole-auth-jdbc/postgresql/schema
        type: volume
